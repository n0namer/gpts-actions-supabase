# AUTOGENERATED_CONTENT_START
openapi: 3.1.0
info:
  title: Supabase Management Command Router for GPT Actions
  version: '2026-05-27'
  description: >
    GPT Actions command-router schema for a Supabase Actions Adapter. The adapter maps MCP-style
    operation enums to the official Supabase Management REST API at https://api.supabase.com.
servers:
  - url: https://YOUR_SUPABASE_ACTIONS_ADAPTER_BASE_URL
security:
  - adapterBearerAuth: []
paths:
  /supabase/observe:
    post:
      operationId: observeSupabase
      summary: Run read-only Supabase Management command
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObserveRequest'
      responses:
        '200':
          description: Sanitized command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupabaseCommandResult'
  /supabase/apply:
    post:
      operationId: applySupabase
      summary: Run write/destructive Supabase Management command
      description: Requires explicit user confirmation before the call. Adapter must verify confirmed=true.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        '200':
          description: Sanitized command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupabaseCommandResult'
  /supabase/capabilities:
    get:
      operationId: listSupabaseCapabilities
      summary: List supported Supabase command operations and upstream mapping version
      x-openai-isConsequential: false
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupabaseCommandResult'
components:
  securitySchemes:
    adapterBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ADAPTER_TOKEN_OR_SUPABASE_PAT
  schemas:
    ObserveRequest:
      type: object
      additionalProperties: false
      properties:
        operation:
          type: string
          enum:
            - profile.get
            - org.list
            - org.get
            - org.members.list
            - org.entitlements.get
            - project.list
            - project.list_by_org
            - project.get
            - project.health.get
            - project.available_regions.list
            - project.restore_versions.list
            - project.upgrade_eligibility.get
            - project.upgrade_status.get
            - project.network_restrictions.get
            - project.network_bans.list
            - project.network_bans.list_enriched
            - project.disk.utilization.get
            - project.disk.autoscale_config.get
            - branch.list
            - branch.get
            - branch.get_by_name
            - branch.config.get
            - branch.diff.get
            - branch.action_runs.list
            - branch.action_run.get
            - branch.action_run.logs.get
            - db.snippets.list
            - db.typescript.generate
            - db.read_only.get
            - db.migrations.list
            - db.migration.get
            - db.ssl.get
            - db.query.read_only
            - functions.list
            - functions.get
            - functions.body.get
            - secrets.list
            - api_keys.list
            - api_keys.get
            - api_keys.legacy.list
            - pgsodium.config.get
            - config.auth.get
            - config.postgrest.get
            - config.storage.get
            - config.realtime.get
            - advisors.performance.get
            - advisors.security.get
            - logs.query
        project_ref:
          type: string
        organization_slug:
          type: string
        organization_id:
          type: string
        branch_id_or_ref:
          type: string
        branch_name:
          type: string
        function_slug:
          type: string
        migration_version:
          type: string
        key_id:
          type: string
        run_id:
          type: string
        sql:
          type: string
          description: Only for db.query.read_only. Prefer SELECT, EXPLAIN and metadata inspection.
        filters:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
        traceId:
          type: string
      required: [operation]
    ApplyRequest:
      type: object
      additionalProperties: false
      properties:
        operation:
          type: string
          enum:
            - org.create
            - project.create
            - project.update
            - project.delete
            - project.pause
            - project.restore
            - project.restore.cancel
            - project.upgrade.postgres
            - project.network_restrictions.patch
            - project.network_restrictions.apply
            - project.network_bans.delete
            - project.disk.modify
            - branch.create
            - branch.delete_by_name
            - branch.config.create
            - branch.config.update
            - branch.config.delete
            - branch.push
            - branch.merge
            - branch.reset
            - branch.restore
            - branch.disable_preview_branching
            - db.query
            - db.migration.apply
            - db.migration.upsert
            - db.migration.patch
            - db.migration.rollback
            - db.webhooks.enable
            - db.ssl.update
            - db.read_only.update
            - db.read_only.temporary_disable
            - functions.bulk_update
            - functions.update
            - functions.deploy
            - functions.delete
            - secrets.upsert
            - secrets.delete
            - api_keys.create
            - api_keys.update
            - api_keys.delete
            - config.auth.update
            - config.postgrest.update
            - config.storage.update
            - config.realtime.update
        project_ref:
          type: string
        organization_slug:
          type: string
        organization_id:
          type: string
        branch_id_or_ref:
          type: string
        branch_name:
          type: string
        function_slug:
          type: string
        migration_version:
          type: string
        key_id:
          type: string
        sql:
          type: string
          description: Only for db.query. Requires explicit confirmation and post-verification.
        payload:
          type: object
          additionalProperties: true
        dryRun:
          type: boolean
        confirmed:
          type: boolean
          description: Must be true after explicit user confirmation.
        confirmationText:
          type: string
        traceId:
          type: string
      required: [operation, confirmed]
    SupabaseCommandResult:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        operation:
          type: string
        mode:
          type: string
          enum: [observe, apply]
        upstream:
          type: object
          additionalProperties: true
          properties:
            method:
              type: string
            url:
              type: string
            status:
              type: number
        data:
          description: Sanitized result. Adapter must redact secrets, JWTs, keys, passwords and connection strings.
        warnings:
          type: array
          items:
            type: string
        nextVerification:
          type: array
          items:
            type: string
        traceId:
          type: string
# AUTOGENERATED_CONTENT_END

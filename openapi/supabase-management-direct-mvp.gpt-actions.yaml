openapi: 3.1.0
info:
  title: Supabase Management Direct MVP for GPT Actions
  version: "1.0.0"
  description: Fast import-safe GPT Actions schema for the official Supabase Management API. Exactly 30 operations. Direct calls to https://api.supabase.com. No adapter.
servers:
- url: https://api.supabase.com
security:
- supabaseBearerAuth: []
paths:
  /v1/profile:
    get:
      operationId: getSupabaseProfile
      summary: Get authenticated Supabase profile
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /v1/organizations:
    get:
      operationId: listSupabaseOrganizations
      summary: List organizations
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /v1/organizations/{slug}/projects:
    get:
      operationId: listSupabaseOrganizationProjects
      summary: List projects for organization
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
  /v1/projects:
    get:
      operationId: listSupabaseProjects
      summary: List projects
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
    post:
      operationId: createSupabaseProject
      summary: Create project
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
  /v1/projects/available-regions:
    get:
      operationId: listSupabaseAvailableRegions
      summary: List available regions
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
  /v1/projects/{ref}:
    get:
      operationId: getSupabaseProject
      summary: Get project
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSupabaseProject
      summary: Update project
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
    delete:
      operationId: deleteSupabaseProject
      summary: Delete project
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
  /v1/projects/{ref}/health:
    get:
      operationId: getSupabaseProjectHealth
      summary: Get project health
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
  /v1/projects/{ref}/pause:
    post:
      operationId: pauseSupabaseProject
      summary: Pause project
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
  /v1/projects/{ref}/restore:
    post:
      operationId: restoreSupabaseProject
      summary: Restore project
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
  /v1/projects/{ref}/database/query/read-only:
    post:
      operationId: runSupabaseReadOnlySqlQuery
      summary: Run read-only SQL query
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /v1/projects/{ref}/database/query:
    post:
      operationId: runSupabaseSqlQuery
      summary: Run SQL query
      x-openai-isConsequential: true
      description: Potentially destructive. Use read-only SQL first and require confirmation.
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /v1/projects/{ref}/database/migrations:
    get:
      operationId: listSupabaseDatabaseMigrations
      summary: List database migrations
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: applySupabaseDatabaseMigration
      summary: Apply database migration
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /v1/projects/{ref}/database/migrations/{version}:
    get:
      operationId: getSupabaseDatabaseMigration
      summary: Get database migration
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: upsertSupabaseDatabaseMigration
      summary: Upsert database migration
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
    patch:
      operationId: patchSupabaseDatabaseMigration
      summary: Patch database migration
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
    delete:
      operationId: rollbackSupabaseDatabaseMigration
      summary: Rollback database migration
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
  /v1/projects/{ref}/secrets:
    get:
      operationId: listSupabaseSecrets
      summary: List secrets metadata
      description: Do not expose secret values.
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: upsertSupabaseSecrets
      summary: Upsert Supabase secrets
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
    delete:
      operationId: deleteSupabaseSecrets
      summary: Delete Supabase secrets
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /v1/projects/{ref}/api-keys:
    get:
      operationId: listSupabaseApiKeys
      summary: List Supabase API keys
      description: Do not expose API key values.
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createSupabaseApiKey
      summary: Create Supabase API key
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /v1/projects/{ref}/config/auth:
    get:
      operationId: getSupabaseAuthConfig
      summary: Get Supabase Auth config
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSupabaseAuthConfig
      summary: Update Supabase Auth config
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /v1/projects/{ref}/config/storage:
    get:
      operationId: getSupabaseStorageConfig
      summary: Get Supabase Storage config
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSupabaseStorageConfig
      summary: Update Supabase Storage config
      x-openai-isConsequential: true
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /v1/projects/{ref}/logs:
    post:
      operationId: querySupabaseProjectLogs
      summary: Query Supabase project logs
      x-openai-isConsequential: false
      responses:
        '200':
          description: OK
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
components:
  securitySchemes:
    supabaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SUPABASE_PAT_OR_OAUTH_ACCESS_TOKEN
  schemas:
    GenericRequest:
      type: object
      properties:
        payload:
          type: object
          properties: {}
          additionalProperties: true
        name:
          type: string
        value:
          type: string
        enabled:
          type: boolean
      additionalProperties: true
    SqlRequest:
      type: object
      properties:
        query:
          type: string
          description: SQL query to execute.
      required:
        - query
      additionalProperties: true
    ProjectCreateRequest:
      type: object
      properties:
        organization_id:
          type: string
        name:
          type: string
        region:
          type: string
        db_pass:
          type: string
          description: Never print this value.
        plan:
          type: string
      required:
        - organization_id
        - name
        - region
        - db_pass
      additionalProperties: true
    MigrationRequest:
      type: object
      properties:
        name:
          type: string
        query:
          type: string
      required:
        - query
      additionalProperties: true
    SecretsUpsertRequest:
      type: object
      properties:
        secrets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
                description: Never print this value.
            required:
              - name
              - value
            additionalProperties: true
      additionalProperties: true
    SecretsDeleteRequest:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
      additionalProperties: true
    LogsQueryRequest:
      type: object
      properties:
        sql:
          type: string
        query:
          type: string
        iso_timestamp_start:
          type: string
        iso_timestamp_end:
          type: string
      additionalProperties: true
